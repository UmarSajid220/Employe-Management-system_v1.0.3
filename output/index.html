<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Square Skills Academy - Employee Management System</title>
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f5f4 0%, #fef3c7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #44403c;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d97706 0%, #ea580c 100%);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 2rem;
        }
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
        }
        p {
            margin: 0 0 2rem 0;
            color: #78716c;
        }
        .btn {
            display: inline-block;
            background: #d97706;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #b45309;
        }
        .loading {
            margin-top: 1rem;
            color: #78716c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-users"></i>
        </div>
        <h1>A Square Skills Academy</h1>
        <p>Employee Management System</p>
        <a href="frontend/index.html" class="btn">Login to System</a>
        <div class="loading">
            <p>Redirecting to login page...</p>
            <p><small>If not redirected automatically, <a href="frontend/index.html">click here</a></small></p>
        </div>
    </div>
    
    <script>
        // Fallback redirect after 3 seconds
        setTimeout(function() {
            window.location.href = 'frontend/index.html';
        }, 3000);
    </script>
</body>
</html>
