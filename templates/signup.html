{% extends 'base.html' %}
{% block content %}
<div class="dashboard-container" 
     style="max-width:420px; margin:80px auto; padding:32px; border-radius:16px;
            box-shadow:0 6px 18px rgba(0,0,0,0.1); background:linear-gradient(135deg, #f9fafb, #eef2ff);">
  
  <h2 style="text-align:center; color:#1e3a8a; margin-bottom:24px; font-weight:700;">
    Employee Sign Up
  </h2>

  {% if message %}
    <p style="color:#2563eb; text-align:center; margin-bottom:18px; font-weight:500;">
      {{ message }}
    </p>
  {% endif %}

  <form method="post" style="display:flex; flex-direction:column; gap:16px;">
    <input name="username" placeholder="Choose Username" required
      style="padding:12px 16px; border-radius:10px; border:1px solid #c7d2fe;
             background:#f3f4f6; font-size:1.05em; transition:all 0.2s ease;
             outline:none;"
      onfocus="this.style.border='1px solid #3b82f6'; this.style.background='#fff'"
      onblur="this.style.border='1px solid #c7d2fe'; this.style.background='#f3f4f6'">
    
    <input type="submit" value="Sign Up"
      class="btn-blue"
      style="background:#2563eb; color:white; font-weight:600; padding:12px 0;
             border:none; border-radius:10px; font-size:1.05em; cursor:pointer;
             transition:background 0.2s ease;"
      onmouseover="this.style.background='#1e40af'"
      onmouseout="this.style.background='#2563eb'">
  </form>

  <div style="margin-top:24px; text-align:center;">
    <a href="/login"
       style="display:inline-block; padding:10px 18px; color:#2563eb; font-weight:500;
              text-decoration:none; border:1px solid #2563eb; border-radius:8px;
              transition:all 0.2s ease;"
       onmouseover="this.style.background='#2563eb'; this.style.color='#fff'"
       onmouseout="this.style.background='transparent'; this.style.color='#2563eb'">
      Back to Login
    </a>
  </div>
</div>
{% endblock %}
