{% extends 'base.html' %}
{% block content %}
<div style="text-align:center; margin-top:60px;">
  <h1 style="font-family:'Poppins', Arial, sans-serif; font-size:2.4em; font-weight:700; 
             color:#ffffff; letter-spacing:1px; text-shadow:0 2px 6px rgba(30,58,138,0.10);">
    A Square Skills Management
  </h1>
</div>

<div class="dashboard-container"
     style="max-width:420px; margin:40px auto; padding:36px; background:linear-gradient(135deg, #f9fafb, #eef2ff);
            border-radius:16px; box-shadow:0 6px 18px rgba(0,0,0,0.08);">

  <div style="text-align:center; margin-bottom:24px;">
    <span style="display:inline-block; color:#1e3a8a; font-family:'Poppins', Arial, sans-serif;
                 font-size:2em; font-weight:700; padding:10px 30px; letter-spacing:1px;">
      Login
    </span>
  </div>

  {% if message %}
    <p style="color:#dc2626; text-align:center; margin-bottom:18px; font-weight:500;">
      {{ message }}
    </p>
  {% endif %}

  <form method="post" style="display:flex; flex-direction:column; gap:16px;">
    <input name="username" placeholder="Enter Username" required
      style="padding:12px 16px; border-radius:10px; border:1px solid #c7d2fe;
             background:#f3f4f6; font-size:1.05em; color:#111827; transition:all 0.2s ease;
             outline:none;"
      onfocus="this.style.border='1px solid #3b82f6'; this.style.background='#fff'"
      onblur="this.style.border='1px solid #c7d2fe'; this.style.background='#f3f4f6'">

    <input type="submit" value="Login"
      class="animated-btn"
      style="background:#2563eb; color:#fff; border:none; border-radius:10px; width:100%;
             font-size:1.05em; font-weight:600; cursor:pointer; padding:12px 0; letter-spacing:0.5px;
             transition:background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;"
      onmouseover="this.style.background='#1e40af'; this.style.transform='translateY(-2px) scale(1.03)'; this.style.boxShadow='0 4px 14px rgba(37,99,235,0.3)'"
      onmouseout="this.style.background='#2563eb'; this.style.transform='none'; this.style.boxShadow='none'">
  </form>

  <div style="margin-top:28px; text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center;">
    <a href="/signup" class="animated-btn"
       style="display:inline-block; background:transparent; color:#2563eb; border:1px solid #2563eb;
              border-radius:10px; padding:10px 18px; text-decoration:none; width:80%; max-width:260px;
              font-weight:600; transition:all 0.2s ease;"
       onmouseover="this.style.background='#2563eb'; this.style.color='#fff'"
       onmouseout="this.style.background='transparent'; this.style.color='#2563eb'">
       Employee Sign Up
    </a>

    <a href="/admin_signup" class="animated-btn"
       style="display:inline-block; background:#2563eb; color:#fff; border:none; border-radius:10px;
              padding:10px 18px; text-decoration:none; width:80%; max-width:260px; font-weight:600;
              transition:background 0.2s ease, transform 0.2s ease;"
       onmouseover="this.style.background='#1e40af'; this.style.transform='translateY(-2px) scale(1.03)'"
       onmouseout="this.style.background='#2563eb'; this.style.transform='none'">
       Create New Admin
    </a>
  </div>
</div>
{% endblock %}
